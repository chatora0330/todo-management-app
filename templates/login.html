{% extends "base.html" %}

{% block title %}ログイン{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="mb-4 text-center">
                    ログイン
                </h2>

                <form method="post">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}">

                    <div class="mb-3">

                        <label class="form-label">
                            ユーザー名
                        </label>

                        <input 
                            type="text" 
                            name="username"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            パスワード
                        </label>

                        <input 
                        type="password" 
                        name="password"
                        class="form-control" 
                        required>

                    </div>

                    <button class="btn btn-primary w-100">
                        ログイン
                    </button>

                </form>

            </div>

        </div>
    
    </div>

</div>

{% endblock %}
