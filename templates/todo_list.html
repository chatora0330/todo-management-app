{% extends "base.html" %}

{% block title %}
ToDo一覧
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>ToDo一覧</h2>

    <a href="{{ url_for('todo.add') }}" class="btn btn-success">

        + 新規追加

    </a>

</div>

{% if todos %}

<div class="list-group">

    {% for todo in todos %}

    <div class="list-group-item">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h5 class="mb-2">
                    {{ todo.title }}
                </h5>

                <div class="mb-2">

                    <span class="me-2">
                        状態：
                    </span>

                    <form
                        method="post"
                        action="{{ url_for(
                        'todo.update_status',
                        todo_id=todo.id
                        ) }}"
                        class="d-inline">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}">
                        
                        <select
                            name="status"
                            class="form-select form-select-sm d-inline-block"
                            style="width: 120px;"
                            onchange="this.form.submit()">
                        
                            <option
                                value="未着手"
                                {% if todo.status == "未着手" %}
                                    selected
                                {% endif %}>
                                未着手
                            </option>

                            <option
                                value="進行中"
                                {% if todo.status == "進行中" %}
                                    selected
                                {% endif %}>
                                進行中
                            </option>

                            <option
                                value="完了"
                                {% if todo.status == "完了" %}
                                    selected
                                {% endif %}>
                                完了
                            </option>

                        </select>

                    </form>

                </div>

            </div>

            <div>

                <a href="{{ url_for(
                        'todo.edit',
                        todo_id=todo.id
                    ) }}" class="btn btn-outline-primary btn-sm">

                    編集

                </a>

                <form
                    method="post"
                    action="{{ url_for(
                        'todo.delete',
                        todo_id=todo.id
                    ) }}"
                    class="d-inline">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}">
                    
                    <button
                        type="submit"
                        class="btn btn-outline-danger btn-sm"
                        onclick="return confirm('このToDoを削除しますか？');">
                    
                        削除

                    </button>

                </form>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% else %}

<div class="alert alert-info">

    ToDoがありません。

</div>

{% endif %}

{% endblock %}
