{% extends "base.html" %}

{% block title %}
ToDo一覧
{% endblock %}

{% block content %}

<div class="card shadow-sm mb-4">

    <div class="card-body">

        <h5 class="card-title mb-3">
            ToDo検索
        </h5>

        <form method="get"
            action=" {{ url_for('todo.index')}}">
            
            <div class="row g-3">

                <div class="col-md-5">

                    <label class="form-label">
                        タイトル
                    </label>

                    <input
                        type="text"
                        name="keyword"
                        class="form-control"
                        value="{{ keyword }}"
                        placeholder="タイトルを入力">

                </div>

                <div class="col-md-3">

                    <label class="form-label">
                        ステータス
                    </label>

                    <select
                        name="status"
                        class="form-select">
                    
                        <option value="">
                            全て
                        </option>

                        <option
                            value="未着手"
                            {% if status == "未着手" %}
                                selected
                            {% endif %}>
                            未着手
                        </option>

                        <option
                            value="進行中"
                            {% if status == "進行中" %}
                                selected
                            {% endif %}>
                            進行中
                        </option>

                        <option
                            value="完了"
                            {% if status == "完了" %}
                                selected
                            {% endif %}>
                            完了
                        </option>
                    
                    </select>

                </div>

                <div class="col-md-3">

                    <label class="form-label">
                        優先度
                    </label>

                    <select
                        name="priority"
                        class="form-select">
                    
                        <option value="">
                            全て
                        </option>

                        <option
                            value="高"
                            {% if priority == "高" %}
                                selected
                            {% endif %}>
                            高
                        </option>

                        <option
                            value="中"
                            {% if priority == "中" %}
                                selected
                            {% endif %}>
                            中
                        </option>

                        <option
                            value="低"
                            {% if priority == "低" %}
                                selected
                            {% endif %}>
                            低
                        </option>
                    
                    </select>

                </div>

                <div class="col-md-1 d-flex align-items-end">

                    <button
                        type="submit"
                        class="btn btn-primary w-100">
                    
                        検索
                    
                    </button>

                </div>

                <div class="col-md-1 d-flex align-items-end">

                    <a
                        href="{{ url_for('todo.index')}}"
                        class="btn btn-secondary w-100">
                    
                        リセット
                    
                    </a>

                </div>

            </div>
            
        </form>

    </div>

</div>


<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>ToDo一覧</h2>

    <a href="{{ url_for('todo.add') }}" class="btn btn-success">

        + 新規追加

    </a>

</div>

{% if todos %}

<div class="list-group">

    {% for todo in todos %}

    <div class="list-group-item">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h5 class="mb-2">
                    {{ todo.title }}
                </h5>

                <div class="mb-2">

                    <span class="me-2">
                        状態：
                    </span>

                    <form
                        method="post"
                        action="{{ url_for(
                        'todo.update_status',
                        todo_id=todo.id
                        ) }}"
                        class="d-inline">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}">
                        
                        <select
                            name="status"
                            class="form-select form-select-sm d-inline-block"
                            style="width: 120px;"
                            onchange="this.form.submit()">
                        
                            <option
                                value="未着手"
                                {% if todo.status == "未着手" %}
                                    selected
                                {% endif %}>
                                未着手
                            </option>

                            <option
                                value="進行中"
                                {% if todo.status == "進行中" %}
                                    selected
                                {% endif %}>
                                進行中
                            </option>

                            <option
                                value="完了"
                                {% if todo.status == "完了" %}
                                    selected
                                {% endif %}>
                                完了
                            </option>

                        </select>

                    </form>

                </div>

            </div>

            <div>

                <a href="{{ url_for(
                        'todo.edit',
                        todo_id=todo.id
                    ) }}" class="btn btn-outline-primary btn-sm">

                    編集

                </a>

                <form
                    method="post"
                    action="{{ url_for(
                        'todo.delete',
                        todo_id=todo.id
                    ) }}"
                    class="d-inline">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}">
                    
                    <button
                        type="submit"
                        class="btn btn-outline-danger btn-sm"
                        onclick="return confirm('このToDoを削除しますか？');">
                    
                        削除

                    </button>

                </form>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% else %}

<div class="alert alert-info">

    条件に一致するToDoがありません。

</div>

{% endif %}

{% endblock %}
