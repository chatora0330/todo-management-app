{% extends "base.html" %}

{% block title %}
ToDo一覧
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>ToDo一覧</h2>

    <a href="{{ url_for('todo.add') }}" class="btn btn-success">

        + 新規追加

    </a>

</div>

{% if todos %}

<div class="list-group">

    {% for todo in todos %}

    <div class="list-group-item">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h5>{{ todo.title }}</h5>

                <p class="mb-0">
                    {{ todo.status }}
                </p>

            </div>

            <div>

                <a href="{{ url_for(
                        'todo.edit',
                        todo_id=todo.id
                    ) }}" class="btn btn-outline-primary btn-sm">

                    編集

                </a>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% else %}

<div class="alert alert-info">

    ToDoがありません。

</div>

{% endif %}

{% endblock %}
